name: 📰 Tistory RSS → 기자/ (reusable)

# ── 중앙 재사용 워크플로 ─────────────────────────────────────────────────────
# 5개 레포의 동일한 tistory-sync 로직을 여기 한 곳으로 모은다.
# 각 레포는 얇은 caller 로 `uses: bayaba-1979/bayaba_phone/.github/workflows/tistory-sync.yml@main`
# + `with: blog: <내 블로그 slug>` 만 쓴다. 로직을 고칠 땐 여기만 고치면 전부 반영.
#
# blog 를 required 로 둔 이유: schedule 트리거에서는 workflow_call inputs 가
# 채워지지 않으므로, 자체 schedule 은 각 레포의 caller 가 갖고 재사용 본문은
# workflow_call 로만 호출되게 한다. (inputs 기본값은 schedule 에서 안 먹히는 함정 회피)

on:
  workflow_call:
    inputs:
      blog:
        required: true
        type: string
        description: "티스토리 블로그 slug (예: helena-piano)"
      out_dir:
        required: false
        type: string
        default: '기자'
      user_agent:
        required: false
        type: string
        default: 'bayaba-bot/1.0'
      git_name:
        required: false
        type: string
        default: 'bayaba-bot'
      git_email:
        required: false
        type: string
        default: 'bayaba-1979@github.com'

jobs:
  sync:
    # git push(기자/ 커밋)가 필요 → contents: write.
    # 단, 권한의 최종 결정권은 caller. 각 caller 워크플로에도 반드시
    # `permissions: contents: write` 를 둔다 (fresh 포크 기본값 read-only 함정 방지).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS → 기자/
        run: |
          mkdir -p "${{ inputs.out_dir }}"
          python3 << 'PYEOF'
          import os, hashlib, urllib.request, xml.etree.ElementTree as ET
          blog = "${{ inputs.blog }}"
          out_dir = "${{ inputs.out_dir }}"
          user_agent = "${{ inputs.user_agent }}"
          rss_url = f"https://{blog}.tistory.com/rss"
          print(f"📡 {rss_url}")
          try:
              req = urllib.request.Request(rss_url, headers={"User-Agent": user_agent})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read().decode("utf-8")
              root = ET.fromstring(data)
              for item in root.findall(".//item")[:10]:
                  title_el = item.find("title"); link_el = item.find("link")
                  desc_el = item.find("description"); date_el = item.find("pubDate")
                  title = title_el.text.strip() if title_el is not None and title_el.text else "(no-title)"
                  link = link_el.text.strip() if link_el is not None and link_el.text else ""
                  desc = desc_el.text.strip() if desc_el is not None and desc_el.text else ""
                  pubdate = date_el.text.strip() if date_el is not None and date_el.text else ""
                  if not link: continue
                  fid = hashlib.md5(link.encode()).hexdigest()[:12]
                  fname = os.path.join(out_dir, f"{blog}_{fid}.md")
                  if os.path.exists(fname): continue
                  with open(fname, "w") as f:
                      f.write(f"---\nsource: {link}\ndate: {pubdate}\nblog: {blog}\n---\n\n# {title}\n\n{desc}\n\n---\n원문: {link}\n")
                  print(f"  ✅ {title}")
          except Exception as e:
              print(f"  ⚠️ {e}")
          PYEOF
      - name: Commit & push
        run: |
          if git diff --quiet "${{ inputs.out_dir }}/" 2>/dev/null; then echo "변경 없음"; exit 0; fi
          git config user.name "${{ inputs.git_name }}"; git config user.email "${{ inputs.git_email }}"
          git add "${{ inputs.out_dir }}/"; git commit -m "📰 RSS sync: $(date +%Y-%m-%d\ %H:%M)" || true; git push
