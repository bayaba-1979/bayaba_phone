name: Deploy GitHub Pages

# 허브(helena_phone) 자신의 Pages 배포 — 중앙 재사용 워크플로 호출 (build=true).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: helena751107/helena_phone/.github/workflows/pages-deploy.yml@main
    with:
      build: true
