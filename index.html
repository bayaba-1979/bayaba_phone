<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S21 Phone — Workstation Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 800px;
      padding: 3rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: #8b949e;
      margin-top: 0.5rem;
      font-size: 1rem;
    }
    .main-content {
      width: 100%;
      max-width: 800px;
      padding: 1.5rem;
      flex: 1;
    }
    .section-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section-card h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #f0f6fc;
    }
    .section-card h2 span {
      margin-right: 0.5rem;
    }
    footer {
      width: 100%;
      max-width: 800px;
      padding: 1.5rem;
      text-align: center;
      color: #484f58;
      font-size: 0.85rem;
      border-top: 1px solid #21262d;
    }
    /* Giscus 댓글 영역 */
    .giscus {
      width: 100%;
      min-height: 200px;
    }
    /* 위젯봇 오버라이드 */
    .widgetbot-placeholder {
      display: none;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .section-card { padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📱 S21 Phone</h1>
    <p>Workstation Live — Termux → Claude Code → GitHub</p>
  </header>

  <div class="main-content">

    <!-- 프로젝트 카드 -->
    <div class="section-card">
      <h2><span>📂</span> 프로젝트</h2>
      <p><a href="https://github.com/helena751107/helena_phone" style="color:#58a6ff;">helena751107/helena_phone</a></p>
      <p style="margin-top:0.5rem; color:#8b949e; font-size:0.9rem;">
        GitHub Pages + Claude Code(DeepSeek Radar) + Aider
      </p>
    </div>

    <!-- 디스코드 채팅 (WidgetBot Crate) -->
    <div class="section-card">
      <h2><span>💬</span> 실시간 채팅 — Discord</h2>
      <p style="color:#8b949e; font-size:0.9rem; margin-bottom:0.5rem;">
        아래 우하단 버튼으로 디스코드 채널에 접속하세요.
      </p>
    </div>

    <!-- 게시판 / 댓글 (Giscus) -->
    <div class="section-card">
      <h2><span>🗣</span> 댓글 / 게시판 — GitHub Discussions</h2>
      <div class="giscus"></div>
    </div>

  </div>

  <footer>
    <p>S21 Phone Workstation · Powered by Claude Code + DeepSeek</p>
  </footer>

    crossorigin="anonymous"
    async>
  </script>
  -->

</body>
</html>
